project:
  type: book
  output-dir: _book
  pre-render:
    - ../tools/capi_page.py
    - ../tools/options_page.py
    - quartodoc build
  post-render:
    - ../tools/references_page.py
    - ../tools/chapter_numbers.py

book:
  title: biyos
  subtitle: Optimization, honestly
  favicon: logo/favicon.svg
  downloads: [pdf]
  search: true
  page-navigation: true
  sidebar:
    logo:
      light: logo/lockup.svg
      dark: logo/lockup-reversed.svg
    logo-alt: biyos
    title: false
    style: floating
  chapters:
    - index.qmd
    - part: User guide
      chapters:
        - guide/start.qmd
        - guide/model.qmd
        - guide/options.qmd
        - guide/events.qmd
        - guide/copy.qmd
        - guide/errors.qmd
        - guide/threads.qmd
        - guide/python.qmd
    - part: Method
      chapters:
        - method/form.qmd
        - method/graph.qmd
        - method/tapes.qmd
        - method/derivatives.qmd
        - method/hessian.qmd
        - method/intervals.qmd
        - method/curvature.qmd
    - part: Reference
      chapters:
        - reference/capi.qmd
        - reference/options.qmd
        - reference/codes.qmd
        - reference/formats.qmd
        - reference/python.qmd
    - references.qmd

number-sections: true
number-depth: 1
tbl-colwidths: true

bibliography: references.bib
csl: theme/references.csl
link-citations: true
filters:
  - path: filters/generated.lua
    at: pre-ast
  - path: filters/include.lua
    at: pre-ast
  - path: filters/figures.lua
    at: pre-ast
  - path: filters/names.lua
    at: pre-ast
  - path: filters/callouts.lua
    at: pre-ast
  - path: filters/signatures.lua
    at: pre-ast
  - path: filters/meta.lua
    at: pre-ast
  - path: filters/tables.lua
    at: post-render
  - path: filters/breaks.lua
    at: post-render

format:
  html:
    theme:
      light: [theme/biyos.scss, theme/light.scss]
      dark: [theme/biyos.scss, theme/dark.scss]
    respect-user-color-scheme: true
    highlight-style:
      light: theme/code-light.theme
      dark: theme/code-dark.theme
    include-in-header: theme/fonts.html
    include-after-body: theme/toc.html
    html-math-method: mathjax
    toc: true
    toc-location: right-body
    toc-depth: 3
    toc-title: On this page
    code-copy: hover
    anchor-sections: true
    smooth-scroll: true
    reference-location: margin
  pdf:
    documentclass: scrbook
    classoption: [oneside, open=any, parskip=half-, numbers=noendperiod]
    papersize: a4
    geometry: [top=26mm, bottom=30mm, left=30mm, right=30mm, headsep=10mm]
    pdf-engine: lualatex
    fontsize: 10pt
    linestretch: 1.22
    mainfont: Inter
    mainfontoptions: [Numbers=Lining]
    sansfont: Inter
    monofont: JetBrains Mono
    monofontoptions: [Scale=MatchLowercase, Contextuals=NoAlternate, Ligatures=NoCommon]
    fig-pos: H
    mathfont: Fira Math
    toc-depth: 1
    toc-title: Contents
    include-in-header: theme/preamble.tex
    highlight-style: theme/code-light.theme
    colorlinks: true

quartodoc:
  style: single-page
  package: biyos
  source_dir: ../interfaces/python/src
  dir: reference/_python
  parser: numpy
  options:
    include_empty: true
    member_order: source
  renderer:
    style: filters.renderer.py
    header_level: 2
  sections:
    - title: Environments
      desc: An environment holds the options and the hooks, and every model is made on one.
      contents: [Env, Checking, Masks, OptionSource, Error, version, Versions]
    - title: Models
      desc: A model holds the variables, functions, constraints, objectives, cones and complements of a problem.
      contents: [Model, inf, VariableKind, ObjectiveSense, SpecialOrderedSetKind, ConeKind, FileFormat, Operator]
    - title: Blocks and views
      desc: The items an add call returns, which pass wherever the model takes indices.
      contents:
        - name: Variables
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - Variable
        - name: Functions
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - Function
        - name: Constraints
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - Constraint
        - name: Objectives
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - Objective
        - name: Indicators
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - Indicator
        - name: SpecialOrderedSets
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - SpecialOrderedSet
        - name: PiecewiseLinears
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - PiecewiseLinear
        - name: Cones
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - Cone
        - name: Complements
          include_inherited: true
          members: [__len__, __contains__, __iter__, __getitem__, "on"]
        - Complement
    - title: Expressions
      desc: What arithmetic on variables builds, for addobj and addcon to take.
      contents:
        - name: Expression
          include_inherited: true
          members: [__add__, __sub__, __mul__, __truediv__, __pow__, __neg__, __abs__, __le__, __ge__, __eq__]
        - Comparison
        - exp
        - log
        - sqrt
        - sin
        - cos
        - tan
        - asin
        - acos
        - atan
        - sinh
        - cosh
        - tanh
        - asinh
        - acosh
        - atanh
        - erf
        - entropy
        - signpow
        - piecewise
        - max
        - min
    - title: Events
      desc: What a hook receives.
      contents: [Event, EventKind, EventLevel]
    - title: Callbacks
      desc: What a callback receives.
      contents: [CallbackRequest]
