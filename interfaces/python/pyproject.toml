[build-system]
requires = ["scikit-build-core==1.1.2"]
build-backend = "scikit_build_core.build"

[project]
name = "biyos"
version = "0.1.0"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.py-api = "py3"

