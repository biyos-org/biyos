name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  PREFIX: ${{ github.workspace }}/build/install

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      os: ${{ steps.pick.outputs.os }}
      cpp: ${{ steps.areas.outputs.cpp }}
      format: ${{ steps.areas.outputs.format }}
      python: ${{ steps.areas.outputs.python }}
      types: ${{ steps.areas.outputs.types }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: areas
        env:
          ALL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$ALL" = true ]; then
            python3 tools/ci_changes.py --all < /dev/null >> "$GITHUB_OUTPUT"
          else
            git diff --name-only HEAD^1 HEAD | python3 tools/ci_changes.py >> "$GITHUB_OUTPUT"
          fi
      - id: pick
        env:
          ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$ALL" = true ]; then
            echo 'os=["ubuntu-24.04", "macos-15", "windows-2022"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.cpp }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          path: build/_deps/googletest-subbuild/googletest-populate-prefix/src/*.tar.gz
          key: googletest-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: googletest-${{ runner.os }}-${{ github.job }}-
      - if: env.RUN == 'true'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBIYOS_WARNINGS_AS_ERRORS=ON
      - if: env.RUN == 'true'
        run: cmake --build build --config Release
      - if: env.RUN == 'true'
        run: ctest --test-dir build -C Release --output-on-failure
      - if: env.RUN == 'true'
        run: cmake --install build --config Release --prefix "${{ env.PREFIX }}"
      - if: env.RUN == 'true'
        run: cmake -S examples -B build/examples -DCMAKE_BUILD_TYPE=Release -DBIYOS_WARNINGS_AS_ERRORS=ON "-DCMAKE_PREFIX_PATH=${{ env.PREFIX }}"
      - if: env.RUN == 'true'
        run: cmake --build build/examples --config Release
      - if: env.RUN == 'true'
        run: ctest --test-dir build/examples -C Release --output-on-failure

  format:
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install clang-format==21.1.8
      - run: git ls-files '*.c' '*.h' '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  layers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: >-
          python3 tools/check_layers.py
          --sources src
          --layers tools/layers.txt
          --roles tools/roles.txt
      - run: >-
          python3 tools/check_docs.py
          --headers include/biyos
          --doc docs/reference/capi.txt
      - run: >-
          python3 tools/check_copies.py
          --licence LICENSE
          --copies $(git ls-files '*LICENSE')
          --library CMakeLists.txt
          --examples examples/CMakeLists.txt
          --python interfaces/python/pyproject.toml
      - run: python3 -m unittest discover -s tools -p 'test_*.py'

  sanitizers:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    env:
      FLAGS: -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/_deps/googletest-subbuild/googletest-populate-prefix/src/*.tar.gz
          key: googletest-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: googletest-${{ runner.os }}-${{ github.job }}-
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBIYOS_WARNINGS_AS_ERRORS=ON "-DCMAKE_C_FLAGS=$FLAGS" "-DCMAKE_CXX_FLAGS=$FLAGS"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "${{ env.PREFIX }}"
      - run: cmake -S examples -B build/examples -DCMAKE_BUILD_TYPE=Debug -DBIYOS_WARNINGS_AS_ERRORS=ON "-DCMAKE_C_FLAGS=$FLAGS" "-DCMAKE_PREFIX_PATH=${{ env.PREFIX }}"
      - run: cmake --build build/examples
      - run: ctest --test-dir build/examples --output-on-failure

  threads:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    env:
      FLAGS: -fsanitize=thread -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/_deps/googletest-subbuild/googletest-populate-prefix/src/*.tar.gz
          key: googletest-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: googletest-${{ runner.os }}-${{ github.job }}-
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBIYOS_WARNINGS_AS_ERRORS=ON "-DCMAKE_C_FLAGS=$FLAGS" "-DCMAKE_CXX_FLAGS=$FLAGS"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "${{ env.PREFIX }}"
      - run: cmake -S examples -B build/examples -DCMAKE_BUILD_TYPE=Debug -DBIYOS_WARNINGS_AS_ERRORS=ON "-DCMAKE_C_FLAGS=$FLAGS" "-DCMAKE_PREFIX_PATH=${{ env.PREFIX }}"
      - run: cmake --build build/examples
      - run: ctest --test-dir build/examples --output-on-failure

  tidy:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install clang-tidy==21.1.6
      - run: cmake -S . -B build -DBIYOS_BUILD_TESTS=OFF
      - run: git ls-files 'src/*.cpp' | xargs clang-tidy -p build --quiet

  python:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.python }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - if: env.RUN == 'true'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBIYOS_BUILD_TESTS=OFF ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0' || '' }}
      - if: env.RUN == 'true'
        run: cmake --build build --config Release
      - if: env.RUN == 'true'
        run: cmake --install build --config Release --prefix "${{ env.PREFIX }}"
      - if: env.RUN == 'true'
        env:
          CMAKE_PREFIX_PATH: ${{ env.PREFIX }}
        run: python -m pip install ./interfaces/python pytest==9.2.0
      - if: env.RUN == 'true'
        run: pytest interfaces/python/tests

  types:
    needs: changes
    if: needs.changes.outputs.types == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install mypy==2.4.1
      - run: mypy --strict interfaces/python/src/biyos

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install quartodoc==0.11.1 griffe==1.15.0
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render the book and refuse any warning
        shell: bash
        run: |
          quarto render docs --to html 2>&1 | tee render.log
          if grep -E "WARN|ERROR" render.log; then exit 1; fi
