name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBIYOS_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install clang-format==21.1.8
      - run: git ls-files '*.c' '*.h' '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  layers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_layers.py
      - run: python3 tools/check_docs.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      FLAGS: -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBIYOS_WARNINGS_AS_ERRORS=ON "-DCMAKE_C_FLAGS=$FLAGS" "-DCMAKE_CXX_FLAGS=$FLAGS"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install clang-tidy==21.1.6
      - run: cmake -S . -B build -DBIYOS_BUILD_TESTS=OFF
      - run: git ls-files 'src/*.cpp' | xargs clang-tidy -p build --quiet
